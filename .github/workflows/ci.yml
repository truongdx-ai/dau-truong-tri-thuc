name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcovr valgrind libssl-dev clang-format
      - run: make format-check
      - run: make all
      - run: make test
      - run: make coverage
      - run: make valgrind
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
